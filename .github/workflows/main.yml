name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      P: ${{ github.workspace }}/app-project
    steps:
      - name: Project
        run: |
          set -e
          D=$P/app/src/main; mkdir -p $D/java/a; cd $P
          V=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml | grep -oP '<release>\K[^<]+' | head -1)
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral();maven{url=uri("https://maven.mozilla.org/maven2/")}}}
          include(":app")' > settings.gradle.kts
          echo android.useAndroidX=true > gradle.properties
          echo "plugins{id(\"com.android.application\") version \"8.10.1\";id(\"org.jetbrains.kotlin.android\") version \"2.1.20\"}
          android{namespace=\"a\";compileSdk=36
          defaultConfig{applicationId=\"a.browser\";minSdk=26;targetSdk=36}
          compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17}
          kotlinOptions{jvmTarget=\"17\"}}
          dependencies{implementation(\"org.mozilla.geckoview:geckoview-omni:$V\")}" > app/build.gradle.kts
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <application android:label="ALISER" android:theme="@android:style/Theme.Material.NoActionBar">
          <activity android:name="a.M" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>' > $D/AndroidManifest.xml
          cat > $D/java/a/M.kt <<'X'
          package a
          import android.app.Activity
          import android.os.Bundle
          import android.view.inputmethod.EditorInfo
          import android.widget.EditText
          import android.widget.LinearLayout
          import org.mozilla.geckoview.*
          class M : Activity() {
              companion object { var rt: GeckoRuntime? = null }
              lateinit var s: GeckoSession
              var back = false
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val r = rt ?: GeckoRuntime.create(applicationContext).also { rt = it }
                  val bar = EditText(this)
                  bar.setSingleLine(); bar.imeOptions = EditorInfo.IME_ACTION_GO
                  s = GeckoSession()
                  s.navigationDelegate = object : GeckoSession.NavigationDelegate {
                      override fun onCanGoBack(x: GeckoSession, c: Boolean) { back = c }
                  }
                  s.open(r)
                  val v = GeckoView(this); v.setSession(s)
                  bar.setOnEditorActionListener { _, _, _ ->
                      val t = bar.text.toString().trim()
                      s.loadUri(if (t.contains(".") && !t.contains(" ")) (if (t.startsWith("http")) t else "https://$t") else "https://duckduckgo.com/?q=" + android.net.Uri.encode(t))
                      true
                  }
                  val l = LinearLayout(this); l.orientation = LinearLayout.VERTICAL; l.fitsSystemWindows = true
                  l.addView(bar); l.addView(v, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(l)
                  s.loadUri("https://duckduckgo.com")
              }
              @Deprecated("x") override fun onBackPressed() { if (back) s.goBack() else super.onBackPressed() }
          }
          X
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - run: gradle --no-daemon -p $P :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app-project/app/build/outputs/apk/debug/app-debug.apk
