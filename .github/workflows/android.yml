name: Build ALISER APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ALISER source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "ALISER-Browser-source.zip" ]; then
            mkdir -p source
            unzip -oq "ALISER-Browser-source.zip" -d source
          else
            echo "ERROR: ALISER-Browser-source.zip is missing from repository root."
            exit 1
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find source -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts was not found in the ZIP."
            find source -maxdepth 5 -type f -print
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found in $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 5 -type f -print
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Print build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info             -p "$PROJECT_DIR" :app:assembleDebug

      - name: Verify APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created or is empty."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALISER-Browser-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
